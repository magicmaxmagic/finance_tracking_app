services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://finance_user:finance_password@postgres:5432/finance_db
      SECRET_KEY: your-super-secret-key-change-in-production-min-32-chars
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Volumes disabled due to filesystem deadlock issues on macOS
    # volumes:
    #   - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # Volumes disabled due to filesystem deadlock issues on macOS
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
